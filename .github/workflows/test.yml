name: Types + Vitest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci --no-audit --no-fund

      # Type-check BEFORE the tests, and never skip it on failure.
      #
      # 2026-09-09: a broken commit went green here and was caught only by the
      # Vercel build, which failed and refused to deploy. The break was a
      # variable shadowing the function it calls — `const laborRange =
      # laborRange(...)` — a compile error and a throw on the Reports page.
      #
      # vitest is deliberately pure-logic: no DOM, no database, no build. It
      # structurally cannot see a type error, so a red build looked green in
      # GitHub and the only signal was a failed deployment nobody was watching.
      # Vercel already type-checks; this just moves the alarm to where people
      # look, before the deploy rather than after.
      - run: npx tsc --noEmit

      - run: npm run test
        env:
          COMMERCIAL_ARCHIVE_HMAC_SECRET: ci-test-secret-32-chars-1234567890abc
          COMMERCIAL_ARCHIVE_LOCAL: orders
          COMMERCIAL_ARCHIVE_DOMAIN: orders.precisionpaintingplus.net
