name: Types + Vitest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # THE NODE VERSION COMES FROM .nvmrc, AND FROM NOWHERE ELSE.
      #
      # This said "20" while Vercel builds and runs this project on 24.x and
      # both developers are on 24 — so CI was the only thing testing against a
      # runtime production does not use. That is not a theoretical gap. On
      # 2026-10-06 it cost a day's worth of red runs and an email per push:
      #
      #   Intl renders midnight as "24:00" on Node 20's ICU and "00:00" on 24
      #   node:module.stripTypeScriptTypes does not exist before 22.18
      #
      # Both passed locally, failed here, and neither was a bug in the product.
      # The reverse is worse and was only ever luck: a green run on 20 proves
      # nothing about the runtime the code actually executes on.
      #
      # node-version-file rather than a literal, so the version lives in one
      # place that `nvm use` also reads. package.json's engines field states
      # the same bound for anyone installing without nvm.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci --no-audit --no-fund

      # Type-check BEFORE the tests, and never skip it on failure.
      #
      # 2026-09-09: a broken commit went green here and was caught only by the
      # Vercel build, which failed and refused to deploy. The break was a
      # variable shadowing the function it calls — `const laborRange =
      # laborRange(...)` — a compile error and a throw on the Reports page.
      #
      # vitest is deliberately pure-logic: no DOM, no database, no build. It
      # structurally cannot see a type error, so a red build looked green in
      # GitHub and the only signal was a failed deployment nobody was watching.
      # Vercel already type-checks; this just moves the alarm to where people
      # look, before the deploy rather than after.
      - run: npx tsc --noEmit

      - run: npm run test
        env:
          COMMERCIAL_ARCHIVE_HMAC_SECRET: ci-test-secret-32-chars-1234567890abc
          COMMERCIAL_ARCHIVE_LOCAL: orders
          COMMERCIAL_ARCHIVE_DOMAIN: orders.precisionpaintingplus.net

      # THE WIRING CHECK, WHICH HAS BEEN CATCHING REAL BUGS AND NOT RUNNING HERE.
      #
      # It asserts that each rule's value reaches the call that enforces it —
      # not that a function exists, but that the two ends are joined. That is
      # a class vitest structurally cannot see: every unit test passes while a
      # value is computed, handed to one consumer, and withheld from another.
      #
      # It has caught, among others, the disclosure resolving against a global
      # office flag rather than the recipient, and a sandbox given a thinner
      # context than production. It needs no database and no secrets, so there
      # was never a reason for it to be missing here beyond nobody adding it.
      - run: npm run check:rules

      # AN OPTION NOTHING PASSES, which is a capability the product does not
      # have. Karan, 2026-10-07: "how do we keep missing so many simple
      # issues" — because they are not wrong code, they are correct code
      # nobody calls, and a unit test calls the thing itself so it cannot see
      # that. This catches the shape that cost the most today: Kate's rule
      # that a bare "yes" counts as availability, implemented, tested, and
      # never reachable, so the best leads could not be closed.
      - run: npm run check:options

      # The lint budget, for the same reason: a number that only ever goes up
      # is not a budget.
      - run: npm run lint:budget
