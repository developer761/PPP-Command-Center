name: Types + Vitest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci --no-audit --no-fund

      # Type-check BEFORE the tests, and never skip it on failure.
      #
      # 2026-09-09: a broken commit went green here and was caught only by the
      # Vercel build, which failed and refused to deploy. The break was a
      # variable shadowing the function it calls — `const laborRange =
      # laborRange(...)` — a compile error and a throw on the Reports page.
      #
      # vitest is deliberately pure-logic: no DOM, no database, no build. It
      # structurally cannot see a type error, so a red build looked green in
      # GitHub and the only signal was a failed deployment nobody was watching.
      # Vercel already type-checks; this just moves the alarm to where people
      # look, before the deploy rather than after.
      - run: npx tsc --noEmit

      - run: npm run test
        env:
          COMMERCIAL_ARCHIVE_HMAC_SECRET: ci-test-secret-32-chars-1234567890abc
          COMMERCIAL_ARCHIVE_LOCAL: orders
          COMMERCIAL_ARCHIVE_DOMAIN: orders.precisionpaintingplus.net

      # THE WIRING CHECK, WHICH HAS BEEN CATCHING REAL BUGS AND NOT RUNNING HERE.
      #
      # It asserts that each rule's value reaches the call that enforces it —
      # not that a function exists, but that the two ends are joined. That is
      # a class vitest structurally cannot see: every unit test passes while a
      # value is computed, handed to one consumer, and withheld from another.
      #
      # It has caught, among others, the disclosure resolving against a global
      # office flag rather than the recipient, and a sandbox given a thinner
      # context than production. It needs no database and no secrets, so there
      # was never a reason for it to be missing here beyond nobody adding it.
      - run: npm run check:rules

      # The lint budget, for the same reason: a number that only ever goes up
      # is not a budget.
      - run: npm run lint:budget
