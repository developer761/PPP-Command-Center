# Keep the platform current while Salesforce is still being used.
#
# Tomco run both systems for about two weeks after go-live: new work goes into
# the platform, and Salesforce is wound down. Anything they enter there has to
# come across, and until now that meant Karan running a command by hand — 15
# transactions and $7,179.79 accumulated in the few hours of one afternoon.
#
# WHY A WORKFLOW AND NOT A VERCEL CRON. The importer is a standalone script, and
# the Vercel crons call functions in lib/. Wiring it in means refactoring the
# script's entry point — and that script is the thing producing a to-the-cent
# reconciliation against Salesforce. This runs it EXACTLY as it is, so what
# happens hourly is what Karan has already watched work by hand.
#
# THIS IS TEMPORARY BY DESIGN. Delete this file the day Salesforce is switched
# off; there is nothing else to unpick.
#
# SAFE TO RUN UNATTENDED: every stage is idempotent (commercial_import_map maps
# each Salesforce id to its row, so a re-run updates rather than duplicating),
# and the platform-wins guard refuses to overwrite a row somebody has edited
# here — it reports the clash instead.

name: Salesforce → platform sync

on:
  schedule:
    # Hourly, on the hour. Frequent enough that nothing is ever more than an
    # hour stale, cheap enough to sit inside the Actions allowance.
    - cron: "0 * * * *"
  # So it can be run on demand — at cutover, or after a big entry session.
  workflow_dispatch:

# Never let two runs overlap: both would be writing the same rows.
concurrency:
  group: salesforce-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
      SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
      SF_CONSUMER_SECRET: ${{ secrets.SF_CONSUMER_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The stages that actually move day to day. Deals and invoices are
      # deliberately not here: they change rarely, and a daily eye on them is
      # better than an hourly one nobody reads.
      - name: Pull what changed
        run: node scripts/import-tomco.mjs --stage=costs,payments,attendance --commit

      # Always, even if the pull failed — the reconciliation is how anyone knows
      # whether the two systems still agree.
      - name: Reconcile
        if: always()
        run: |
          set +e
          node scripts/import-tomco.mjs --reconcile 2>&1 | tee /tmp/reconcile.txt
          echo "### Salesforce reconciliation" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/reconcile.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Deliberately does NOT fail the run on a difference. Tomco enter in
          # Salesforce continuously, so a figure moving between the pull and the
          # check is normal and a red X every hour would train everyone to
          # ignore it. The numbers are in the summary; read them there.
          exit 0
